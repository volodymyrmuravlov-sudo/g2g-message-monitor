name: G2G message check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: g2g-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check G2G messages
        env:
          G2G_COOKIES_JSON: ${{ secrets.G2G_COOKIES_JSON }}
          G2G_LOCAL_STORAGE_JSON: ${{ secrets.G2G_LOCAL_STORAGE_JSON }}
          G2G_INBOX_URL: ${{ vars.G2G_INBOX_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_messages.py

      - name: Commit state
        run: |
          git config user.name "g2g-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "Update state [skip ci]"

          # The concurrency group above mostly serializes runs, but pushes
          # have still been observed to race and fail with "failed to push
          # some refs" (non-fast-forward) - retry with a rebase instead of
          # letting one push conflict fail the whole run.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push failed (attempt $i/5) - fetching and rebasing before retry..."
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort
              echo "::error::Rebase conflict on attempt $i - giving up"
              exit 1
            fi
            sleep $((RANDOM % 4 + 1))
          done

          echo "::error::Failed to push state after 5 attempts"
          exit 1
